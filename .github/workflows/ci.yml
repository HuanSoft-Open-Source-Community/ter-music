name: CI

on:
  push:
    branches:
      - master
      - testing
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            container: ""
          - label: fedora
            container: "fedora:latest"
          - label: arch
            container: "archlinux:latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.label == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev \
            libavfilter-dev libswscale-dev libpng-dev libjpeg-dev \
            libpulse-dev libncursesw5-dev libcurl4-openssl-dev libxml2-dev \
            libsqlite3-dev libpipewire-0.3-dev libasound2-dev libdbus-1-dev \
            zlib1g-dev ffmpeg

      - name: Install dependencies (Fedora)
        if: matrix.label == 'fedora'
        run: |
          dnf install -y \
            gcc make cmake pkgconf-pkg-config \
            ffmpeg-free-devel libpng-devel libjpeg-turbo-devel \
            pulseaudio-libs-devel ncurses-devel libcurl-devel libxml2-devel \
            sqlite-devel alsa-lib-devel pipewire-devel dbus-devel \
            util-linux ffmpeg-free

      - name: Install dependencies (Arch)
        if: matrix.label == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake pkgconf \
            ffmpeg libpng libjpeg-turbo pulseaudio ncurses curl libxml2 \
            sqlite zlib alsa-lib libpipewire dbus util-linux

      - name: Adapt includes for Arch ncurses
        if: matrix.label == 'arch'
        run: |
          find . \( -name "*.c" -o -name "*.h" \) -exec \
            sed -i 's|<ncursesw/ncurses.h>|<ncurses.h>|g' {} +

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Smoke test (--help)
        run: ./build/ter-music --help >/dev/null

      - name: Smoke test (CLI commands)
        run: |
          set -e
          ./build/ter-music version
          ./build/ter-music help >/dev/null
          rc=0; ./build/ter-music pause || rc=$?
          [ "$rc" -eq 3 ] || { echo "pause without instance: rc=$rc (expected 3)"; exit 1; }
          rc=0; ./build/ter-music show || rc=$?
          [ "$rc" -eq 3 ] || { echo "show without instance: rc=$rc (expected 3)"; exit 1; }

      - name: CLI / daemon / D-Bus smoke test
        if: matrix.label == 'ubuntu'
        run: |
          if ! command -v dbus-run-session >/dev/null 2>&1; then
            echo "dbus-run-session unavailable, skipping D-Bus smoke test"
            exit 0
          fi
          set -e
          rm -rf /tmp/tm-cli
          mkdir -p /tmp/tm-cli/music /tmp/tm-cli/home
          ffmpeg -hide_banner -loglevel error -f lavfi \
            -i anullsrc=r=44100:cl=mono -t 2 -c:a pcm_s16le \
            -y /tmp/tm-cli/music/a.wav
          # 无音频设备时播放会失败，但 daemon 必须保持存活且 D-Bus 接口可用
          dbus-run-session -- bash -euc '
            export HOME=/tmp/tm-cli/home
            TM=./build/ter-music
            $TM daemon start --open /tmp/tm-cli/music
            sleep 1
            $TM show --json | grep -q "\"running\":true"
            $TM show --one-line
            $TM mode list_repeat
            $TM volume 50
            gdbus call --session --dest org.mpris.MediaPlayer2.ter_music \
              --object-path /org/mpris/MediaPlayer2 \
              --method org.yxzl.ter_music.Info.InstanceInfo >/dev/null
            $TM daemon status
            $TM daemon reload
            $TM daemon stop
          '

      - name: Smoke test (PTY launch)
        if: matrix.label == 'ubuntu'
        run: |
          set -e
          mkdir -p /tmp/tm-smoke/sub /tmp/tm-home
          ffmpeg -hide_banner -loglevel error -f lavfi \
            -i anullsrc=r=44100:cl=mono -t 1 -c:a pcm_s16le \
            -y /tmp/tm-smoke/sub/t.wav
          set +e
          HOME=/tmp/tm-home TERM=xterm timeout 8 script -qec \
            "HOME=/tmp/tm-home TERM=xterm ./build/ter-music -o /tmp/tm-smoke/sub" \
            /dev/null </dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "PTY smoke test failed with exit code $rc" >&2
            exit 1
          fi

  strict:
    name: strict-warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev \
            libavfilter-dev libswscale-dev libpng-dev libjpeg-dev \
            libpulse-dev libncursesw5-dev libcurl4-openssl-dev libxml2-dev \
            libsqlite3-dev libpipewire-0.3-dev libasound2-dev libdbus-1-dev \
            zlib1g-dev

      - name: Configure (strict warnings)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build -j2

      - name: Smoke test
        run: ./build/ter-music --help >/dev/null

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Shellcheck
        run: shellcheck scripts/build/*.sh scripts/docker/*.sh

      - name: Syntax check
        run: bash -n scripts/build/*.sh scripts/docker/*.sh scripts/test/*.sh

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev

      - name: Backend purity (core serves playback, not content)
        run: scripts/test/check-core-purity.sh

      - name: Frontend purity (UI must not touch the playback surface)
        run: scripts/test/check-ui-purity.sh

      - name: Config ownership (the front end must not write the core config)
        run: scripts/test/check-config-ownership.sh

      - name: Unit tests
        run: scripts/test/run-unit-tests.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev \
            libavfilter-dev libswscale-dev libpng-dev libjpeg-dev \
            libpulse-dev libncursesw5-dev libcurl4-openssl-dev libxml2-dev \
            libsqlite3-dev libpipewire-0.3-dev libasound2-dev libdbus-1-dev \
            zlib1g-dev ffmpeg dbus python3-gi gir1.2-glib-2.0

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: D-Bus RPC surface
        run: scripts/test/dbus-rpc-check.sh --bin ./build/ter-music

      - name: Config migration
        run: scripts/test/config-migration-check.sh --bin ./build/ter-music

      - name: Frontend lifecycle
        run: scripts/test/lifecycle-e2e.sh --bin ./build/ter-music

      - name: Offline and reconnect
        run: scripts/test/offline-reconnect-e2e.sh --bin ./build/ter-music

      - name: Multiple frontends
        run: scripts/test/multi-frontend-e2e.sh --bin ./build/ter-music

      - name: Deep directories and queue paging
        run: scripts/test/paging-deepdir-e2e.sh --bin ./build/ter-music

      - name: Remote source delivered as local files
        run: scripts/test/remote-frontend-e2e.sh --bin ./build/ter-music

      # A6 的实测值记录下来（--report 不判定）：共享 runner 的时延/CPU 抖动大，
      # 拿它当门禁只会制造假红；本机（scripts/test/perf-check.sh 不带 --report）
      # 才是阈值判定的地方。
      - name: Performance (latency and idle CPU, report only)
        run: scripts/test/perf-check.sh --bin ./build/ter-music --report

  required-checks:
    name: required-checks
    if: always()
    needs: [build, strict, shellcheck, gates, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI jobs passed
        env:
          BUILD: ${{ needs.build.result }}
          STRICT: ${{ needs.strict.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          GATES: ${{ needs.gates.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          [ "$BUILD" = "success" ] || { echo "build: $BUILD" >&2; exit 1; }
          [ "$STRICT" = "success" ] || { echo "strict: $STRICT" >&2; exit 1; }
          [ "$SHELLCHECK" = "success" ] || { echo "shellcheck: $SHELLCHECK" >&2; exit 1; }
          [ "$GATES" = "success" ] || { echo "gates: $GATES" >&2; exit 1; }
          [ "$E2E" = "success" ] || { echo "e2e: $E2E" >&2; exit 1; }
